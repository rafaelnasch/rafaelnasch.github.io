<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<meta name="portal-iv" content="kFOBTnn96p7LUNiG">
<title>Portal editorial | GrowAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#171b20;--muted:#606976;--line:#dce0e5;--accent:#b33e0a;--orange:#ff6a1a;--paper:#fff;--soft:#f5f6f8;--display:'Sora',sans-serif;--body:'Source Sans 3',sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;color:var(--ink);background:var(--paper);font-family:var(--body);font-size:18px}body{display:flex;flex-direction:column;min-width:0}button,a{font:inherit}a{color:var(--accent)}button{cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px} [hidden]{display:none!important}
.portal-header{flex:none;width:100%;border-bottom:1px solid var(--line);padding:14px 24px 0;background:var(--paper)}.masthead{max-width:1080px;margin:0 auto 8px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:var(--display);font-size:18px;letter-spacing:-.6px;color:var(--ink);text-decoration:none}.brand span{display:inline-block;margin-right:10px;color:var(--accent);font-family:var(--body);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;vertical-align:middle}.share{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:5px;color:var(--ink);font-size:15px;line-height:1.4}.share svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px}.navigation{max-width:1080px;margin:auto;display:flex;gap:18px;overflow:auto;scrollbar-width:thin;white-space:nowrap;padding:3px 2px 0}.navigation a{display:block;text-decoration:none;color:var(--muted);font-size:16px;font-weight:600;padding:9px 2px 12px;border-bottom:3px solid transparent}.navigation a[aria-current=page]{color:var(--ink);border-color:var(--orange)}.frame-region{flex:1;min-height:0;min-width:0;position:relative}iframe{display:block;border:0;width:100%;height:100%;background:var(--paper)}
.state{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;padding:24px}.message{max-width:540px;width:100%;border-top:3px solid var(--orange);padding-top:24px}.message .label{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase}.message h1{font:600 32px/1.25 var(--display);letter-spacing:-1px;margin:16px 0}.message p{font-size:18px;line-height:1.65;margin:0;overflow-wrap:anywhere}.status-line{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 18px;background:var(--ink);color:var(--paper);border-radius:6px;font-size:16px;z-index:10;text-align:center}.skip{position:absolute;top:-80px;left:16px;z-index:20;background:var(--paper);padding:12px}.skip:focus{top:8px}
@media(max-width:600px){.portal-header{padding:10px 16px 0}.masthead{gap:8px;margin-bottom:2px}.brand{font-size:16px}.brand span{font-size:10px;margin-right:6px;letter-spacing:.6px}.share{font-size:13px;padding:6px 8px}.share svg{display:none}.navigation{gap:16px;scrollbar-width:thin}.navigation a{font-size:15px;padding:8px 1px 10px}.message h1{font-size:28px}.message p{font-size:17px}}
@media(max-width:600px){.navigation{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px;overflow:visible;white-space:normal}.navigation a{text-align:center;font-size:14px;padding:7px 0;line-height:1.4}}
</style>
</head>
<body>
<a class="skip" href="#content">Ir para o conteúdo</a>
<header class="portal-header" id="header" hidden>
  <div class="masthead"><a class="brand" href="#" data-page="inicio"><span>GrowAI</span>Redação do Caico</a><button class="share" id="share" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></svg>Copiar acesso</button></div>
  <nav class="navigation" aria-label="Páginas do portal"><a data-page="inicio" href="#">Início</a><a data-page="estrategia" href="#">Estratégia</a><a data-page="pautas" href="#">180 pautas</a><a data-page="roteiros" href="#">12 roteiros</a><a data-page="calendario" href="#">Calendário</a><a data-page="materiais" href="#">Materiais</a></nav>
</header>
<main class="state" id="state" aria-live="polite"><div class="message"><div class="label">GrowAI · Portal editorial</div><h1 id="state-title">Abrindo seu portal</h1><p id="state-text">Aguarde um instante.</p><noscript>Ative o JavaScript para abrir o conteúdo protegido.</noscript></div></main>
<div class="frame-region" id="region" hidden><iframe id="content" title="Conteúdo do portal editorial" sandbox="allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe></div>
<div class="status-line" id="notice" role="status" hidden></div>
<script src="/caico-editorial/app.js"></script>
</body>
</html>
