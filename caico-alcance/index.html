<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<meta name="portal-iv" content="KEXfnTlczgFN6zFe">
<title>Alcance do Instagram | GrowAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#171b20;--accent:#b33e0a;--orange:#ff6a1a;--paper:#fff;--display:'Sora',sans-serif;--body:'Source Sans 3',sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;color:var(--ink);background:var(--paper);font-family:var(--body);font-size:18px}
iframe{display:block;border:0;width:100%;height:100vh;height:100dvh;background:var(--paper)}[hidden]{display:none!important}
.state{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;padding:24px 16px}.message{max-width:540px;width:100%;border-top:3px solid var(--orange);padding-top:24px}.message .label{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase}.message h1{font:600 32px/1.25 var(--display);letter-spacing:-1px;margin:16px 0}.message p{font-size:18px;line-height:1.65;margin:0;overflow-wrap:anywhere}
@media(max-width:600px){.message h1{font-size:28px}.message p{font-size:17px}}
</style>
</head>
<body>
<main class="state" id="state" aria-live="polite"><div class="message"><div class="label">GrowAI · Caico Borelli</div><h1 id="state-title">Abrindo o relatório</h1><p id="state-text">Aguarde um instante.</p><noscript>Ative o JavaScript para abrir o conteúdo protegido.</noscript></div></main>
<iframe id="content" title="Alcance do Instagram | Caico Borelli" hidden sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
<script src="/caico-alcance/app.js"></script>
</body>
</html>
