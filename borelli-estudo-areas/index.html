<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>Borelli · Estudo de áreas</title>
<style>
:root{--fundo:#f4f5f7;--cartao:#fff;--tinta:#111418;--suave:#59616b;--linha:#d9dde3;--foco:#2f6fed;--erro:#b3261e}
@media (prefers-color-scheme:dark){:root{--fundo:#0f1215;--cartao:#181c21;--tinta:#eef1f4;--suave:#a6aeb8;--linha:#2c333b;--foco:#7aa5ff;--erro:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--tinta)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.cartao{width:100%;max-width:400px;background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:28px 24px}
h1{font-size:22px;line-height:1.3;margin:0 0 6px}
p{margin:0 0 22px;color:var(--suave);font-size:16px;line-height:1.5}
label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--linha);border-radius:8px;margin:0 0 16px;background:var(--cartao);color:var(--tinta)}
input:focus{outline:2px solid var(--foco);outline-offset:1px}
button{width:100%;font:inherit;font-size:17px;font-weight:600;padding:13px;border:0;border-radius:8px;background:var(--tinta);color:var(--cartao);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.erro{color:var(--erro);font-size:15px;min-height:22px;margin:14px 0 0}
.abrindo{color:var(--suave);font-size:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="cartao">
<p class="abrindo" id="cofre-abrindo">Abrindo…</p>
<form id="cofre-form" hidden autocomplete="on">
<h1>Borelli · Estudo de áreas</h1>
<p>Acesso restrito. Entre com o login e a senha que você recebeu.</p>
<label for="cofre-login">Login</label>
<input id="cofre-login" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label for="cofre-senha">Senha</label>
<input id="cofre-senha" name="password" type="password" autocomplete="current-password" required>
<button id="cofre-botao" type="submit">Entrar</button>
<p class="erro" id="cofre-erro" role="alert"></p>
</form>
<noscript><p>Esta página precisa de JavaScript ligado.</p></noscript>
